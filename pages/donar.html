<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About · Tinyearss</title>
<link rel="canonical" href="https://tinyearss.com/about/">
<meta http-equiv="refresh" content="0;url=/about/">
<script>
(() => {
  const target = new URL("/about/", window.location.href);
  const aliases = {};
  let fragment = window.location.hash.slice(1);
  try { fragment = decodeURIComponent(fragment); } catch (_) {}
  target.search = window.location.search;
  target.hash = aliases[fragment.toLowerCase()] || fragment;
  window.location.replace(target.href);
})();
</script>
